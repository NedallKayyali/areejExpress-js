<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog|Section</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- قسم كتالوج العطور -->
    <section id="catalog" class="catalog">
        <div class="container">
            <h2 class="section-title">كتالوج العطور المتاحة للتوصيل الفوري</h2>

            <!-- أزرار الفلترة -->
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="all">الكل</button>
                <button class="filter-btn" data-category="oriental">عطور شرقية</button>
                <button class="filter-btn" data-category="woody">عطور خشبية</button>
                <button class="filter-btn" data-category="floral">عطور زهرية</button>
            </div>

            <!-- شبكة عرض العطور (ستُملأ تلقائياً بواسطة JS) -->
            <div class="perfumes-grid" id="perfumesGrid"></div>
        </div>
    </section>
    <script src="./main.js"></script>
</body>

</html>
